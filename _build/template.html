<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Indian border mapped</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect width='30' height='20' fill='%23fff'/%3E%3Crect width='30' height='6.5' fill='%23FF9933'/%3E%3Crect y='13.5' width='30' height='6.5' fill='%23138808'/%3E%3Ccircle cx='15' cy='10' r='2.6' fill='none' stroke='%23000080' stroke-width='0.35'/%3E%3Cpath d='M15 10L15 7.4M15 10L15.67 7.49M15 10L16.3 7.75M15 10L16.84 8.16M15 10L17.25 8.7M15 10L17.51 9.33M15 10L17.6 10M15 10L17.51 10.67M15 10L17.25 11.3M15 10L16.84 11.84M15 10L16.3 12.25M15 10L15.67 12.51M15 10L15 12.6M15 10L14.33 12.51M15 10L13.7 12.25M15 10L13.16 11.84M15 10L12.75 11.3M15 10L12.49 10.67M15 10L12.4 10M15 10L12.49 9.33M15 10L12.75 8.7M15 10L13.16 8.16M15 10L13.7 7.75M15 10L14.33 7.49' stroke='%23000080' stroke-width='0.3'/%3E%3Ccircle cx='15' cy='10' r='0.45' fill='%23000080'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Rangoli rosette used in the header and at the map's corners. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="petal-outer" d="M0 -41 C11 -31 11 -18 0 -12 C-11 -18 -11 -31 0 -41Z"/>
    <path id="petal-inner" d="M0 -29 C6 -23 6 -15 0 -11 C-6 -15 -6 -23 0 -29Z"/>
    <circle id="bead" cx="0" cy="-46" r="3"/>
    <symbol id="rangoli" viewBox="-50 -50 100 100">
      <g fill="#e8811c">
        <use href="#petal-outer"/><use href="#petal-outer" transform="rotate(45)"/>
        <use href="#petal-outer" transform="rotate(90)"/><use href="#petal-outer" transform="rotate(135)"/>
        <use href="#petal-outer" transform="rotate(180)"/><use href="#petal-outer" transform="rotate(225)"/>
        <use href="#petal-outer" transform="rotate(270)"/><use href="#petal-outer" transform="rotate(315)"/>
      </g>
      <g fill="#137a5a">
        <use href="#petal-inner" transform="rotate(22.5)"/><use href="#petal-inner" transform="rotate(67.5)"/>
        <use href="#petal-inner" transform="rotate(112.5)"/><use href="#petal-inner" transform="rotate(157.5)"/>
        <use href="#petal-inner" transform="rotate(202.5)"/><use href="#petal-inner" transform="rotate(247.5)"/>
        <use href="#petal-inner" transform="rotate(292.5)"/><use href="#petal-inner" transform="rotate(337.5)"/>
      </g>
      <g fill="#f2a93b">
        <use href="#bead" transform="rotate(22.5)"/><use href="#bead" transform="rotate(67.5)"/>
        <use href="#bead" transform="rotate(112.5)"/><use href="#bead" transform="rotate(157.5)"/>
        <use href="#bead" transform="rotate(202.5)"/><use href="#bead" transform="rotate(247.5)"/>
        <use href="#bead" transform="rotate(292.5)"/><use href="#bead" transform="rotate(337.5)"/>
      </g>
      <circle r="10" fill="#fffaf0" stroke="#283a80" stroke-width="3"/>
      <circle r="4.5" fill="#a84d2a"/>
    </symbol>
  </defs>
</svg>

<div class="tricolour"></div>
<header class="site-header">
  <div class="brand">
    <svg width="46" height="46" aria-hidden="true"><use href="#rangoli"/></svg>
    <h1>Every Indian border <span>mapped</span></h1>
    <svg width="46" height="46" aria-hidden="true"><use href="#rangoli"/></svg>
  </div>
</header>
<div class="toran" aria-hidden="true"></div>

<div class="map">
  <svg class="corner tl" aria-hidden="true"><use href="#rangoli"/></svg>
  <svg class="corner tr" aria-hidden="true"><use href="#rangoli"/></svg>
  <svg class="corner bl" aria-hidden="true"><use href="#rangoli"/></svg>
  <svg class="corner br" aria-hidden="true"><use href="#rangoli"/></svg>
<!--SVG-->
  <div class="legend" aria-hidden="true">
    <div><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#000" stroke-width="2.4" stroke-linecap="round"/></svg>International border</div>
    <div><svg width="26" height="8"><line x1="2" y1="4" x2="25" y2="4" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 5"/></svg>De facto lines (LoC, LAC)</div>
    <div><svg width="26" height="8"><line x1="2" y1="4" x2="25" y2="4" stroke="#8f8f8f" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="0 3.6"/></svg>State / UT border</div>
    <div><svg width="26" height="8"><line x1="1" y1="4" x2="25" y2="4" stroke="#1f6fd0" stroke-width="1.2" stroke-linecap="round"/></svg>Coastline</div>
    <div><svg width="26" height="8"><path d="M1 5 Q7 1 13 4 T25 3" fill="none" stroke="#7fa8d6" stroke-width="1.3" stroke-linecap="round"/></svg>River (toggle below)</div>
    <div class="hint">Hover over a border, then click it for its full history</div>
  </div>
  <label class="river-toggle">
    <span>Rivers</span>
    <input type="checkbox" id="river-toggle">
    <span class="switch" aria-hidden="true"></span>
  </label>
</div>
<div class="tip" role="tooltip" hidden></div>
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
    <button class="modal-close" type="button" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-body"></div>
  </div>
</div>
<details class="refs">
  <summary>References (numbers in the hover boxes)</summary>
  <div id="refs-list"></div>
</details>
<footer class="site-footer">
  <div class="divider" aria-hidden="true"><svg width="26" height="26"><use href="#rangoli"/></svg></div>
  <p>An ongoing project of <strong>Vishal Khopkar</strong></p>
</footer>
<div class="tricolour"></div>
<script src="data.js"></script>
<script src="references.js"></script>
<script src="app.js"></script>
</body>
</html>
